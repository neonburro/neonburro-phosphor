# netlify.toml
# Phosphor build, functions, one SPA catch all, the bounded holder sweep and
# the two read only transparency clocks. Observation and accounting may run on
# a schedule. Nothing here signs or submits a transaction.

[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  # 22 because @supabase/supabase-js 2.112 requires node 22 or newer. The studio
  # pins 20, this repo is its own animal. Change .nvmrc in the same sitting.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The old name forwards forever. Every link printed before 2026-08-23 said
# burros.neonburro.com and every one of them keeps landing. Host scoped, so it
# must sit above the SPA catch all or the catch all eats it.
[[redirects]]
  from = "https://burros.neonburro.com/*"
  to = "https://phosphor.neonburro.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Each run checks at most twelve wallets with three concurrent RPC requests and
# saves a cursor. Five-minute runs work through the whole holder set without a
# single function trying to fit every address inside Netlify's execution limit.
# The visit-time holder check remains the immediate path.
[functions."holder-sweep"]
  schedule = "*/5 * * * *"

# Three readings an hour give the public wallet book a smooth seven day line
# without pretending an observation is market activity.
[functions."wallet-observer"]
  schedule = "7,27,47 * * * *"

# Reconciled service shares accrue once an hour in integer microdollars. The
# close only writes ledger rows. A payout remains a human signed proposal.
[functions."earnings-accrual"]
  schedule = "11 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
