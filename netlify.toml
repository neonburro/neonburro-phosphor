# netlify.toml
# phosphor. Build, functions, one SPA catch all, one hourly sweep.

[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  # 22 because @supabase/supabase-js 2.112 requires node 22 or newer. The studio
  # pins 20, this repo is its own animal. If you change this, change .nvmrc too.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The old name forwards forever. Every link printed before 2026-08-23 said
# burros.neonburro.com and every one of them keeps landing. Host scoped, so it
# must sit above the SPA catch all or the catch all eats it.
[[redirects]]
  from = "https://burros.neonburro.com/*"
  to = "https://phosphor.neonburro.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Every wallet the burrow has ever seen gets its balance read again once an
# hour. Falling under the threshold flips eligible to false and the next page
# that wallet opens is the door. Nobody is thrown out mid sentence, nobody stays
# who should not. The per request check in holder-check.js is the fast path,
# this is the slow one that catches a wallet that stopped visiting.
[[scheduled_functions]]
  function = "holder-sweep"
  cron = "17 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
